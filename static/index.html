<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Canvas - Paint Tool</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        label {
            font-weight: bold;
            color: #555;
        }

        input[type="color"] {
            width: 50px;
            height: 35px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        input[type="range"] {
            width: 150px;
            cursor: pointer;
        }

        button {
            padding: 8px 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0056b3;
        }

        #canvas {
            border: 2px solid #333;
            background-color: white;
            cursor: crosshair;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            border-radius: 4px;
        }

        .size-display {
            min-width: 30px;
            text-align: center;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>Shared Canvas - Paint Tool</h1>
    
    <div class="controls">
        <div class="control-group">
            <label for="colorPicker">Color:</label>
            <input type="color" id="colorPicker" value="#000000">
        </div>
        
        <div class="control-group">
            <label for="brushSize">Brush Size:</label>
            <input type="range" id="brushSize" min="1" max="50" value="5">
            <span class="size-display" id="sizeDisplay">5</span>
        </div>
        
        <button id="clearBtn">Clear Canvas</button>
    </div>

    <canvas id="canvas" width="800" height="600"></canvas>

    <script>
        // Get canvas and context
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Get controls
        const colorPicker = document.getElementById('colorPicker');
        const brushSize = document.getElementById('brushSize');
        const sizeDisplay = document.getElementById('sizeDisplay');
        const clearBtn = document.getElementById('clearBtn');

        // Drawing state
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let hasReportedApiError = false;
        let maxRenderedLineID = 0;

        // Configure context
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // Update brush size display
        brushSize.addEventListener('input', (e) => {
            sizeDisplay.textContent = e.target.value;
        });

        // Clear canvas for all clients via backend state.
        clearBtn.addEventListener('click', async () => {
            const confirmed = window.confirm('Clear canvas for everyone?');
            if (!confirmed) {
                return;
            }

            try {
                const response = await fetch('/api/lines/clear', {
                    method: 'POST'
                });

                if (!response.ok) {
                    throw new Error(`API request failed with status ${response.status}`);
                }

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                hasReportedApiError = false;
            } catch (error) {
                console.error('Failed to clear canvas:', error);
                alert('Could not clear canvas. Please try again.');
            }
        });

        function drawLineSegment(x1, y1, x2, y2, color, width) {
            ctx.strokeStyle = color;
            ctx.lineWidth = width;

            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
        }

        async function submitLineSegment(line) {
            try {
                const response = await fetch('/api/lines', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(line)
                });

                if (!response.ok) {
                    throw new Error(`API request failed with status ${response.status}`);
                }

                const payload = await response.json();
                const persistedLineID = Number(payload?.line?.id);
                if (Number.isFinite(persistedLineID) && persistedLineID > maxRenderedLineID) {
                    maxRenderedLineID = persistedLineID;
                }

                hasReportedApiError = false;
            } catch (error) {
                if (!hasReportedApiError) {
                    console.error('Failed to persist line segment:', error);
                    hasReportedApiError = true;
                }
            }
        }

        function drawStoredLines(lines) {
            lines
                .slice()
                .sort((a, b) => (a.id || 0) - (b.id || 0))
                .forEach((line) => {
                    const lineID = Number(line.id) || 0;
                    if (lineID > 0 && lineID <= maxRenderedLineID) {
                        return;
                    }

                    drawLineSegment(line.x1, line.y1, line.x2, line.y2, line.color, line.width);

                    if (lineID > maxRenderedLineID) {
                        maxRenderedLineID = lineID;
                    }
                });
        }

        async function loadStoredLines() {
            try {
                const response = await fetch('/api/lines', {
                    method: 'GET'
                });

                if (!response.ok) {
                    throw new Error(`API request failed with status ${response.status}`);
                }

                const payload = await response.json();
                const lines = Array.isArray(payload.data) ? payload.data : [];

                drawStoredLines(lines);
            } catch (error) {
                console.error('Failed to load stored lines:', error);
            }
        }

        async function pollNewLines() {
            try {
                const response = await fetch(`/api/lines?since=${maxRenderedLineID}`, {
                    method: 'GET'
                });

                if (!response.ok) {
                    throw new Error(`API request failed with status ${response.status}`);
                }

                const payload = await response.json();
                const lines = Array.isArray(payload.data) ? payload.data : [];
                if (lines.length === 0) {
                    if (maxRenderedLineID > 0) {
                        const fullResponse = await fetch('/api/lines', {
                            method: 'GET'
                        });

                        if (fullResponse.ok) {
                            const fullPayload = await fullResponse.json();
                            const fullLines = Array.isArray(fullPayload.data) ? fullPayload.data : [];
                            if (fullLines.length === 0) {
                                ctx.clearRect(0, 0, canvas.width, canvas.height);
                            }
                        }
                    }

                    return;
                }

                drawStoredLines(lines);
            } catch (error) {
                console.error('Failed to poll new lines:', error);
            }
        }

        // Get mouse position relative to canvas
        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        // Start drawing
        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            const pos = getMousePos(e);
            lastX = pos.x;
            lastY = pos.y;
        });

        // Draw on canvas
        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;

            const pos = getMousePos(e);
            const color = colorPicker.value;
            const width = Number(brushSize.value);
            const line = {
                x1: Math.round(lastX),
                y1: Math.round(lastY),
                x2: Math.round(pos.x),
                y2: Math.round(pos.y),
                color,
                width
            };
            
            drawLineSegment(line.x1, line.y1, line.x2, line.y2, color, width);
            submitLineSegment(line);
            
            lastX = pos.x;
            lastY = pos.y;
        });

        // Stop drawing
        canvas.addEventListener('mouseup', () => {
            isDrawing = false;
        });

        // Stop drawing when mouse leaves canvas
        canvas.addEventListener('mouseleave', () => {
            isDrawing = false;
        });

        // Prevent context menu on right click
        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        loadStoredLines().finally(() => {
            setInterval(pollNewLines, 1000);
        });
    </script>
</body>
</html>
