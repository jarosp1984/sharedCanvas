openapi: 3.0.3
info:
  title: sharedCanvas API
  version: 1.0.0
  description: |
    OpenAPI description of the currently implemented HTTP API for sharedCanvas.
    The UI is served separately as static content; this document only describes
    the JSON API.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: lines
    description: Create line segments on a shared canvas session
paths:
  /api/sessions/{sessionId}/lines:
    get:
      tags:
        - lines
      summary: List all line segments in a session
      description: |
        Retrieves all stored line segments in insertion order for the selected session.
      operationId: listLines
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - name: since
          in: query
          required: false
          description: Return only line segments with an ID greater than this value.
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Lines retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListLinesResponse'
              examples:
                success:
                  value:
                    status: ok
                    data:
                      - id: 1
                        x1: 10
                        y1: 20
                        x2: 30
                        y2: 40
                        color: '#112233'
                        width: 5
                      - id: 2
                        x1: 50
                        y1: 60
                        x2: 70
                        y2: 80
                        color: '#aabbcc'
                        width: 3
        '500':
          description: The server failed to retrieve lines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: failed to list lines
    post:
      tags:
        - lines
      summary: Create a line segment in a session
      description: |
        Stores a single line segment in the selected session.

        The request body must contain exactly one JSON object. Unknown fields are
        rejected, and the request body is limited to 1 MiB.
      operationId: createLine
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewLine'
            examples:
              basic:
                summary: Valid line segment
                value:
                  x1: 10
                  y1: 20
                  x2: 30
                  y2: 40
                  color: '#112233'
                  width: 5
      responses:
        '201':
          description: Line stored successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateLineResponse'
              examples:
                success:
                  value:
                    status: ok
                    line:
                      x1: 10
                      y1: 20
                      x2: 30
                      y2: 40
                      color: '#112233'
                      width: 5
        '400':
          description: Invalid JSON payload or validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidSessionId:
                  summary: Invalid session UUID
                  value:
                    error: session_id must be a valid UUID
                invalidJson:
                  summary: Malformed JSON or unknown fields
                  value:
                    error: invalid JSON payload
                multipleObjects:
                  summary: Multiple JSON objects in one request body
                  value:
                    error: request body must contain a single JSON object
                validation:
                  summary: Coordinate outside allowed range
                  value:
                    error: x1 must be between 0 and 800
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: method must be GET or POST
        '500':
          description: The server failed to persist the line
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: failed to save line
  /api/sessions/{sessionId}/lines/clear:
    post:
      tags:
        - lines
      summary: Clear all line segments in a session
      description: |
        Removes all stored line segments from the selected shared canvas session.

        This operation is destructive and affects all connected clients in that session.
      operationId: clearLines
      parameters:
        - $ref: '#/components/parameters/SessionID'
      responses:
        '204':
          description: Lines cleared successfully
        '400':
          description: Invalid session UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: session_id must be a valid UUID
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: method must be POST
        '500':
          description: The server failed to clear lines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: failed to clear lines
components:
  parameters:
    SessionID:
      name: sessionId
      in: path
      required: true
      description: Canonical UUID that identifies the shared canvas session.
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
  schemas:
    NewLine:
      type: object
      additionalProperties: false
      required:
        - x1
        - y1
        - x2
        - y2
        - color
        - width
      properties:
        x1:
          type: integer
          minimum: 0
          maximum: 800
          description: Starting X coordinate on the canvas
        y1:
          type: integer
          minimum: 0
          maximum: 600
          description: Starting Y coordinate on the canvas
        x2:
          type: integer
          minimum: 0
          maximum: 800
          description: Ending X coordinate on the canvas
        y2:
          type: integer
          minimum: 0
          maximum: 600
          description: Ending Y coordinate on the canvas
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
          description: Line color as a 6-digit hexadecimal RGB value
          example: '#112233'
        width:
          type: integer
          minimum: 1
          maximum: 50
          description: Stroke width in pixels
    Line:
      type: object
      additionalProperties: false
      required:
        - id
        - x1
        - y1
        - x2
        - y2
        - color
        - width
      properties:
        id:
          type: integer
          minimum: 1
          description: Unique line identifier assigned by the server
        x1:
          type: integer
          minimum: 0
          maximum: 800
          description: Starting X coordinate on the canvas
        y1:
          type: integer
          minimum: 0
          maximum: 600
          description: Starting Y coordinate on the canvas
        x2:
          type: integer
          minimum: 0
          maximum: 800
          description: Ending X coordinate on the canvas
        y2:
          type: integer
          minimum: 0
          maximum: 600
          description: Ending Y coordinate on the canvas
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
          description: Line color as a 6-digit hexadecimal RGB value
          example: '#112233'
        width:
          type: integer
          minimum: 1
          maximum: 50
          description: Stroke width in pixels
    CreateLineResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - line
      properties:
        status:
          type: string
          enum:
            - ok
        line:
          $ref: '#/components/schemas/Line'
    ListLinesResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - data
      properties:
        status:
          type: string
          enum:
            - ok
        data:
          type: array
          items:
            $ref: '#/components/schemas/Line'
          description: Array of line segments in insertion order
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable error message